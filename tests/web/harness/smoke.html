<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<iframe id="app" src="/DocuBhai/index.html" width="1100" height="800"></iframe>
<pre id="result">PENDING</pre>
<script type="module">
import { PDFDocument, StandardFonts } from "/DocuBhai/vendor/pdf-lib.esm.min.js";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const results = {};
const check = (name, ok, extra = "") => (results[name] = ok ? "ok" : `FAIL ${extra}`);
async function until(fn, tries = 100) { for (let i = 0; i < tries; i++) { const v = await fn(); if (v) return v; await sleep(100); } return null; }

async function makePdf(texts) {
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  for (const t of texts) doc.addPage([595, 842]).drawText(t, { x: 100, y: 700, size: 14, font });
  return doc.save();
}
// Build Files / DataTransfers inside the app's iframe: an ArrayBuffer from another realm fails pdf-lib's instanceof check.
const win = () => document.getElementById("app").contentWindow;
const file = (bytes, name, type = "application/pdf") => new (win().File)([bytes], name, { type });
function setFiles(input, files) {
  const dt = new (win().DataTransfer)();
  files.forEach((f) => dt.items.add(f));
  input.files = dt.files;
  input.dispatchEvent(new Event("change", { bubbles: true }));
}

try {
  const frame = document.getElementById("app");
  await new Promise((r) => frame.addEventListener("load", r));
  const w = frame.contentWindow, d = frame.contentDocument;
  const { viewer } = w.docubhai;
  check("fonts", getComputedStyle(d.body).fontFamily.includes("Comic Sans"));
  await d.fonts.load('14px "Comic Neue"');
  check("bundled-font", d.fonts.check('14px "Comic Neue"') && [...d.fonts].some((f) => f.family.includes("Comic Neue") && f.status === "loaded"));
  check("icon", d.querySelector("link[rel=icon]").href.includes("/DocuBhai/icon.png"));

  // tabs
  d.querySelector('[data-tab="view"]').click();
  check("tab-switch", !d.getElementById("view").hidden && d.getElementById("merge").hidden);

  // viewer: open a 3-page pdf
  const bytes = await makePdf(["Hello viewer", "Second page", "Third page"]);
  setFiles(d.getElementById("view-file"), [file(bytes, "v.pdf")]);
  await until(() => viewer.count === 3);
  check("pages", viewer.count === 3 && d.getElementById("view-of").textContent === "of 3", d.getElementById("msg-text").textContent + " | " + d.getElementById("status").textContent);
  const page = viewer.pages[0].el;
  await until(() => page.querySelector("canvas") && page.querySelectorAll(".textLayer span").length);
  const canvas = page.querySelector("canvas");
  const px = canvas.getContext("2d").getImageData(2, 2, 1, 1).data;
  check("white-background", [...px].join() === "255,255,255,255", [...px].join());
  check("hi-res", canvas.width >= 2 * page.clientWidth - 1, `${canvas.width} vs ${page.clientWidth}`);
  check("text-layer", page.querySelector(".textLayer").textContent.includes("Hello viewer"));

  // select text like a user would
  const span = [...page.querySelectorAll(".textLayer span")].find((s) => s.textContent.includes("Hello"));
  const range = d.createRange();
  range.selectNodeContents(span);
  const sel = frame.contentWindow.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  check("selection", sel.toString().includes("Hello viewer"));

  // zoom + navigation
  viewer.zoomBy(1.25);
  check("zoom", d.getElementById("zoom-label").textContent === "125%", d.getElementById("zoom-label").textContent);
  d.getElementById("view-next").click();
  await sleep(200);
  check("next-page", viewer.page === 1 && d.getElementById("view-page").value === "2");
  d.getElementById("viewer").scrollTop = d.getElementById("viewer").scrollHeight;
  await sleep(300);
  check("continuous-scroll", viewer.page === 2 && d.getElementById("view-page").value === "3", `page ${viewer.page}`);
  await until(() => viewer.pages[2].el.querySelector("canvas"));
  await until(() => viewer.pages[2].el.querySelector(".textLayer span"), 30);
  check("text-on-last-page", viewer.pages[2].el.querySelector(".textLayer")?.textContent.includes("Third page"), viewer.pages[2].el.innerHTML.slice(0, 200));
  check("lazy-render", !!viewer.pages[2].el.querySelector("canvas") && !viewer.pages[0].el.querySelector("canvas") || viewer.count === 3);

  // merge list through the real inputs
  d.querySelector('[data-tab="merge"]').click();
  setFiles(d.getElementById("merge-add"), [file(bytes, "a.pdf"), file(bytes, "b.pdf")]);
  const items = () => [...d.querySelectorAll("#merge-list li")].map((li) => li.textContent);
  check("merge-add", items().join() === "a.pdf,b.pdf", items().join());
  d.querySelectorAll("#merge-list li")[1].click();
  d.getElementById("merge-up").click();
  check("merge-reorder", items().join() === "b.pdf,a.pdf", items().join());

  // ---- merge tab: ticks on the right, select all, multi-select, arrows, remove, clear, preview ----
  const $ = (id) => d.getElementById(id);
  const rows = () => [...d.querySelectorAll("#merge-list li")];
  const names = () => rows().map((li) => li.querySelector(".name").textContent);
  const ticked = () => rows().map((li) => li.querySelector("input").checked);
  const click = (el) => el.click();
  const dis = (id) => $(id).disabled;

  // current list is [b.pdf*, a.pdf] (b ticked from the reorder check above)
  const r0 = rows()[0];
  check("tick-on-right", r0.querySelector("input").getBoundingClientRect().left >= r0.querySelector(".name").getBoundingClientRect().right);
  check("merge-count", $("merge-count").textContent === "1 of 2 selected", $("merge-count").textContent);
  check("select-all-partial", $("merge-all").indeterminate === true && $("merge-all").checked === false);
  check("up-disabled-at-top", dis("merge-up") && !dis("merge-down"));   // b is ticked at the top row

  click($("merge-all"));
  check("select-all", ticked().every(Boolean) && $("merge-all").checked && !$("merge-all").indeterminate && $("merge-count").textContent === "2 of 2 selected");
  check("arrows-off-when-all-ticked", dis("merge-up") && dis("merge-down") && !dis("merge-remove"));
  click($("merge-all"));
  check("deselect-all", ticked().every((t) => !t) && dis("merge-remove") && dis("merge-up") && dis("merge-down"));

  setFiles($("merge-add"), [file(bytes, "c.pdf")]);              // list: b a c, nothing ticked
  click(rows()[2]);                                              // clicking anywhere on the row ticks it
  check("row-click-ticks", ticked().join() === "false,false,true" && rows()[2].className === "selected");
  check("down-disabled-at-bottom", !dis("merge-up") && dis("merge-down"));
  click($("merge-up"));
  check("arrow-up-moves-ticked", names().join() === "b.pdf,c.pdf,a.pdf" && ticked().join() === "false,true,false", names().join());
  click(rows()[0].querySelector("input"));                       // the checkbox itself toggles exactly once
  check("multi-select", ticked().join() === "true,true,false" && $("merge-count").textContent === "2 of 3 selected", ticked().join());
  click($("merge-down"));
  check("arrow-down-moves-group", names().join() === "a.pdf,b.pdf,c.pdf", names().join());
  click($("merge-remove"));
  check("remove-ticked", names().join() === "a.pdf" && ticked().join() === "false");

  setFiles($("merge-add"), [file("plain text", "notes.txt", "text/plain")]);
  check("non-pdf-skipped", names().join() === "a.pdf" && $("status").textContent.includes("Skipped 1"), $("status").textContent);

  // preview: a real merged PDF in a pop-up (a.pdf + b.pdf, 3 pages each)
  setFiles($("merge-add"), [file(await makePdf(["X1", "X2", "X3"]), "b.pdf")]);
  click($("merge-preview"));
  const pv = $("preview");
  await until(() => pv.open && d.querySelectorAll("#preview-viewer .page").length === 6);
  check("preview-opens-with-all-pages", pv.open && d.querySelectorAll("#preview-viewer .page").length === 6, String(d.querySelectorAll("#preview-viewer .page").length));
  check("preview-title", $("preview-title").textContent === "Merge preview - 2 files, 6 pages", $("preview-title").textContent);
  await until(() => d.querySelector("#preview-viewer .page canvas"));
  const pc = d.querySelector("#preview-viewer .page canvas");
  check("preview-renders-white-page", !!pc && [...pc.getContext("2d").getImageData(2, 2, 1, 1).data].join() === "255,255,255,255");
  check("preview-has-download", $("preview-save").textContent.includes("Download") && !$("preview-save").disabled);
  click($("pv-in"));
  check("preview-zoom", $("pv-zoom").textContent !== "100%", $("pv-zoom").textContent);
  click($("preview-close"));
  await sleep(200);
  check("preview-closes-and-frees-pages", !pv.open && d.querySelectorAll("#preview-viewer .page").length === 0);
  check("preview-did-not-change-list", names().join() === "a.pdf,b.pdf" && ticked().every((t) => !t));

  // clear: asks first
  click($("merge-clear"));
  check("clear-asks", $("confirm").open && $("confirm-text").textContent === "Remove all 2 files from the list?", $("confirm-text").textContent);
  click(d.querySelector('#confirm button[value="no"]'));
  await sleep(100);
  check("clear-declined-keeps-files", !$("confirm").open && names().length === 2);
  click($("merge-clear"));
  click(d.querySelector('#confirm button[value="yes"]'));
  await sleep(100);
  check("clear-confirmed-empties", names().length === 0 && dis("merge-clear") && dis("merge-all") && $("merge-count").textContent === "0 of 0 selected");

  // negative: preview / merge with nothing, then with a corrupt file
  click($("merge-preview"));
  await until(() => $("msg").open);
  check("preview-empty-error", $("msg").open && $("msg-text").textContent.includes("Nothing to merge") && !pv.open, $("msg-text").textContent);
  $("msg").close();
  setFiles($("merge-add"), [file("not a pdf at all", "bad.pdf")]);
  click($("merge-preview"));
  await until(() => $("msg").open);
  check("preview-corrupt-error", $("msg-text").textContent.includes("Could not read 'bad.pdf'") && !pv.open, $("msg-text").textContent);
  $("msg").close();
  click($("merge-all"));
  click($("merge-remove"));
  check("remove-last-file", names().length === 0);

  // compare through the real inputs
  const other = await makePdf(["Hello viewer", "Second page", "Mars page"]);
  d.querySelector('[data-tab="compare"]').click();
  setFiles(d.getElementById("cmp-a"), [file(bytes, "one.pdf")]);
  setFiles(d.getElementById("cmp-b"), [file(other, "two.pdf")]);
  d.getElementById("cmp-go").click();
  await until(() => d.getElementById("cmp-out").textContent);
  const out = d.getElementById("cmp-out").textContent;
  check("compare", out.includes("-[p3] Third page") && out.includes("+[p3] Mars page"), out);

  // errors surface in the dialog instead of crashing
  d.querySelector('[data-tab="sign"]').click();
  d.getElementById("sign-go").click();
  await sleep(300);
  check("error-dialog", d.getElementById("msg").open && d.getElementById("msg-text").textContent.includes("choose"));
} catch (e) {
  results.exception = String(e?.stack ?? e);
}
document.getElementById("result").textContent = "RESULT:" + JSON.stringify(results) + ":END";
</script>
